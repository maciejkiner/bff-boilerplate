name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run build -w server

      - name: Push schema
        working-directory: server
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bff_test
        run: npx drizzle-kit push --force

      - name: Run tests
        working-directory: server
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bff_test
          JWT_SECRET: ci-test-secret-not-for-production
          NODE_ENV: test
        run: npm test
